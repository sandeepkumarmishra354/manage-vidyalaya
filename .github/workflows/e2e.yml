name: E2E tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app's migrations assume two application-level roles already
      # exist (see apps/cloud-api/migrations/*_enable-row-level-security.sql
      # header comment: "vidyalaya_app itself is created out-of-band by an
      # ops/superuser step, not by this migration") -- a fresh Postgres
      # service container only has the default superuser, so this step does
      # what a one-time manual `psql` bootstrap does for a real deployment.
      # Passwords here are the same repo-wide dev-only defaults already
      # documented in apps/cloud-api/.env.example -- fine for an ephemeral
      # CI database, never used for anything real.
      - name: Bootstrap database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE vidyalaya WITH LOGIN PASSWORD 'vidyalaya' CREATEDB;"
          psql -h localhost -U postgres -c "CREATE ROLE vidyalaya_app WITH LOGIN PASSWORD 'vidyalaya_app_dev_only_change_me';"
          psql -h localhost -U postgres -c "CREATE DATABASE vidyalaya OWNER vidyalaya;"

      - name: Write cloud-api .env
        working-directory: apps/cloud-api
        run: |
          cat > .env <<'EOF'
          DATABASE_URL="postgresql://vidyalaya:vidyalaya@localhost:5432/vidyalaya?schema=public"
          APP_DATABASE_URL="postgresql://vidyalaya_app:vidyalaya_app_dev_only_change_me@localhost:5432/vidyalaya?schema=public"
          JWT_SECRET="dev-only-change-me"
          JWT_ACCESS_TOKEN_TTL="1h"
          JWT_REFRESH_TOKEN_TTL="30d"
          PORT=3001
          EOF

      - name: Write web .env
        working-directory: apps/web
        run: echo 'VITE_API_BASE_URL="http://localhost:3001"' > .env

      - name: Run migrations
        working-directory: apps/cloud-api
        run: pnpm migrate:up

      - name: Seed demo tenant (incl. E2E personas + North Campus)
        working-directory: apps/cloud-api
        run: pnpm seed

      - name: Cloud API typecheck + unit tests
        working-directory: apps/cloud-api
        run: |
          pnpm typecheck
          pnpm test

      - name: Web typecheck + build
        working-directory: apps/web
        run: |
          pnpm typecheck
          pnpm build

      - name: Run Playwright E2E suite
        working-directory: apps/e2e
        env:
          CI: true
          E2E_DATABASE_URL: "postgresql://vidyalaya:vidyalaya@localhost:5432/vidyalaya"
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
